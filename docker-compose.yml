services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    image: mp-python
    build:
      context: .
      dockerfile: ./python/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      SESSION_KEY: ${SESSION_KEY}
    depends_on:
      - database
    volumes:
      - ./python:/app
      - ./backups:/app/backups

  web:
    image: mp-web
    build:
      context: .
      dockerfile: ./web/Dockerfile
    ports:
      - "443:443"
    depends_on:
      - api
    volumes:
      - ./web/pki:/etc/nginx/pki:ro

  devserver:
    image: node:18-alpine
    working_dir: /app
    user: "1000:1000"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_DEV_API_TARGET: http://api:8000
    ports:
      - "8080:5173"
    depends_on:
      - api
    volumes:
      - ./web/vue:/app

  db-backup:
    image: postgres:16
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    depends_on:
      - database
    environment:
      PGHOST: database
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_DIR: /backups
      BACKUP_RETENTION: "100"
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-02}
      BACKUP_MINUTE_UTC: ${BACKUP_MINUTE_UTC:-00}
      BACKUP_TRIGGER_FILE: /backups/.trigger-now
    command: ["/bin/sh", "/scripts/backup_loop.sh"]
    volumes:
      - ./backups:/backups
      - ./backups/backup_loop.sh:/scripts/backup_loop.sh:ro

volumes:
  postgres_data:
